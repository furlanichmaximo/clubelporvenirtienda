  <style>
    :root {
      --black: #0b0b0b;
      --white: #ffffff;
      --volt: #e6ff00;
      --ink: #111111;
      --paper: #f4f4f4;
      --muted: #666666;
      --line: #e5e5e5;
      --red: #e53935;
      --display: 'Anton', Impact, sans-serif;
      --sans: 'Archivo', sans-serif;
      --ease: cubic-bezier(.16,1,.3,1);
    }

    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--sans); background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased; }
    
    .wrap { width: min(1200px, calc(100% - 48px)); margin: 0 auto; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* Topbar */
    .topbar { background: var(--volt); color: var(--black); font-weight: 700; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; overflow: hidden; white-space: nowrap; }
    .topbar .track { display: inline-flex; gap: 48px; padding: 8px 0; animation: marquee 28s linear infinite; }
    .topbar span::before { content: "★"; margin-right: 12px; }
    @keyframes marquee { to { transform: translateX(-50%); } }

    /* Header */
    header.site { position: sticky; top: 0; z-index: 40; background: var(--black); color: var(--white); border-bottom: 1px solid #222; }
    .head-row { display: flex; align-items: center; gap: 24px; height: 76px; }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; flex-shrink: 0; }
    .brand .crest { width: 44px; height: 50px; object-fit: contain; }
    .brand b { font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: .02em; line-height: .9; display: block; }
    .brand small { display: block; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: #a9a9a9; margin-top: 4px; }
    nav.main { display: flex; gap: 4px; margin-left: 12px; }
    nav.main button { background: none; border: 0; color: #aaa; padding: 8px 12px; font: inherit; font-size: 14px; font-weight: 600; border-radius: 6px; cursor: pointer; transition: all .2s; }
    nav.main button.active, nav.main button:hover { color: var(--white); background: #222; }

    .search { position: relative; flex: 1; max-width: 320px; margin-left: auto; }
    .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; color: #8c8c8c; pointer-events: none; }
    .search-input { width: 100%; background: #161616; border: 1px solid #2c2c2c; border-radius: 999px; padding: 10px 16px 10px 40px; color: #fff; font: inherit; font-size: 13px; }
    .search-input:focus { outline: none; border-color: var(--volt); }

    .cart-btn { position: relative; width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--white); color: var(--black); display: grid; place-items: center; flex-shrink: 0; cursor: pointer; transition: transform .2s var(--ease); }
    .cart-btn:hover { transform: scale(1.06); }
    .cart-btn svg { width: 22px; }
    .cart-count { position: absolute; top: -4px; right: -4px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--volt); color: var(--black); font-size: 12px; font-weight: 800; display: grid; place-items: center; border: 2px solid var(--black); }

    .account { position: relative; flex-shrink: 0; }
    .acct-btn { height: 46px; border-radius: 999px; border: 1px solid #2c2c2c; background: #161616; color: var(--white); display: flex; align-items: center; gap: 8px; padding: 0 16px 0 12px; font: inherit; font-weight: 700; font-size: 13px; white-space: nowrap; cursor: pointer; transition: border-color .2s, background .2s; }
    .acct-btn:hover { border-color: #4a4a4a; background: #1e1e1e; }
    .acct-btn svg { width: 20px; flex-shrink: 0; }
    .acct-btn .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--volt); color: var(--black); display: grid; place-items: center; font-weight: 900; font-size: 14px; margin-left: -6px; }
    .acct-btn .acct-name { max-width: 120px; overflow: hidden; text-overflow: ellipsis; }

    .acct-menu { position: absolute; right: 0; top: calc(100% + 10px); background: var(--white); color: var(--ink); border-radius: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.35); min-width: 230px; padding: 8px; display: none; z-index: 50; }
    .acct-menu.open { display: block; }
    .acct-menu .who { padding: 10px 12px 12px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
    .acct-menu .who b { display: block; font-size: 15px; }
    .acct-menu .who span { font-size: 12px; color: var(--muted); word-break: break-all; }
    .acct-menu button { width: 100%; text-align: left; background: none; border: 0; padding: 10px 12px; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .acct-menu button:hover { background: var(--paper); }
    .acct-menu button svg { width: 18px; }

    /* Hero */
    .hero { position: relative; background: var(--black); color: var(--white); padding: 80px 0; overflow: hidden; }
    .hero-inner { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; gap: 40px; }
    .hero h1 { font-family: var(--display); font-size: 72px; line-height: .95; text-transform: uppercase; margin: 16px 0; }
    .hero h1 em { color: var(--volt); font-style: normal; }
    .hero p { max-width: 480px; font-size: 18px; color: #ccc; margin-bottom: 32px; }
    .kicker { font-size: 12px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--volt); display: block; }

    .socio-card { background: #161616; border: 1px solid #333; border-radius: 20px; padding: 24px; width: 320px; display: grid; gap: 24px; position: relative; overflow: hidden; transition: transform .3s; }
    .socio-card:hover { transform: scale(1.03); }
    .socio-card .top { display: flex; justify-content: space-between; align-items: center; }
